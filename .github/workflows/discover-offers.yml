name: Auto discover free deals

on:
  schedule:
    # Once daily at 06:15 UTC — backup if Vercel cron misses
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger discovery cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://zerospenders.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — calling endpoint may fail; attempting Vercel-style invoke..."
          fi
          CODE=$(curl -s -o /tmp/discover.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/discover-offers")
          echo "HTTP $CODE"
          cat /tmp/discover.json
          if [ "$CODE" != "200" ]; then
            exit 1
          fi
